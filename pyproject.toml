[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-agent-sandbox"
version = "0.1.0"
description = "A controlled Docker execution environment for untrusted repositories"
requires-python = ">=3.14"

[project.scripts]
sas = "sandbox.cli:main"

[tool.setuptools.packages.find]
include = ["sandbox"]